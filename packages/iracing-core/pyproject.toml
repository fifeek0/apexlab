[project]
name = "iracing-core"
version = "0.1.0"
description = "Shared iRacing telemetry core: live ingest, .ibt import, lap store, distance-based alignment and delta"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyirsdk>=1.3.5",
    "pyarrow>=15.0",
]

[project.scripts]
iracing-agent = "iracing_core.watcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iracing_core"]
