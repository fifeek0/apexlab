# CI: tests on every push; Windows installer on tags (v*).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv
          uv pip install -e packages/iracing-core -e apps/analysis -e apps/overlay pytest pytest-qt
      - name: Test (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-project pytest
        shell: bash

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv
          uv pip install -e packages/iracing-core -e apps/analysis -e apps/overlay pyinstaller
      - name: Build bundle
        run: |
          cd packaging
          uv run --no-project pyinstaller iracing_suite.spec --noconfirm
      - name: Build installer
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" packaging\installer.iss
        shell: cmd
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/IRacingSuite-Setup.exe
