[project]
name = "iracing-analysis"
version = "0.1.0"
description = "Post-session iRacing telemetry analysis desktop app (free alternative to paid pro tools)"
requires-python = ">=3.11"
dependencies = [
    "iracing-core",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
    "openai>=1.30",
    "httpx>=0.27",
]

[project.scripts]
iracing-analysis = "iracing_analysis.__main__:main"
iracing-engineer = "iracing_analysis.engineer:main"
garage61-harvest = "iracing_analysis.harvest:main"

[project.optional-dependencies]
voice = ["pyttsx3>=2.90"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.uv.sources]
iracing-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iracing_analysis"]
