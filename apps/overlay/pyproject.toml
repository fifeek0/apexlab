[project]
name = "iracing-overlay"
version = "0.1.0"
description = "Real-time in-sim coaching overlay (skeleton integration point; depends on the shared iracing-core)"
requires-python = ">=3.11"
dependencies = [
    "iracing-core",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
]

[project.scripts]
iracing-overlay = "iracing_overlay.__main__:main"

[tool.uv.sources]
iracing-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iracing_overlay"]
